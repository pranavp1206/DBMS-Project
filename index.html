    .glass-hover { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
    .glass-hover:hover {

    @keyframes numberPop { 0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)} }

    .neon-text-cyan { text-shadow: 0 0 10px rgba(56,189,248,0.5), 0 0 30px rgba(56,189,248,0.2); }
    .neon-text-green { text-shadow: 0 0 10px rgba(16,185,129,0.5), 0 0 30px rgba(16,185,129,0.2); }

  <!-- Particle Canvas -->

  <script>
    // Floating particles background
    (function() {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const PARTICLE_COUNT = 40;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          r: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.3 + 0.05
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(56, 189, 248, ${p.alpha})`;
          ctx.fill();
        });

        // Draw faint connecting lines between nearby particles
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(56, 189, 248, ${0.04 * (1 - dist/120)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ═══════════════════════════════════════════════════════════
    //  MOCK DATA & SEED
    // ═══════════════════════════════════════════════════════════
    const STOCK_ICONS = {
      NVDA: 'fa-microchip', AAPL: 'fa-apple-whole', TSLA: 'fa-car', MSFT: 'fa-windows',
      AMZN: 'fa-box', GOOGL: 'fa-magnifying-glass'
    };
    const STOCK_COLORS = {
      NVDA: '#76b900', AAPL: '#a2aaad', TSLA: '#cc0000', MSFT: '#00a4ef',
      AMZN: '#ff9900', GOOGL: '#4285f4'
    };

    const INITIAL_STOCKS = [
      { id:'NVDA',name:'NVIDIA Corporation',sector:'Technology / AI',price:128.50,prevClose:124.10,high:130.20,low:123.80,volume:854000,marketCap:'$3.16T',availableShares:450 },
      { id:'AAPL',name:'Apple Inc.',sector:'Consumer Electronics',price:224.30,prevClose:221.50,high:225.80,low:220.10,volume:642000,marketCap:'$3.44T',availableShares:600 },
      { id:'TSLA',name:'Tesla, Inc.',sector:'Automotive / EV',price:210.80,prevClose:218.40,high:220.00,low:208.50,volume:1120000,marketCap:'$670B',availableShares:15 },
      { id:'MSFT',name:'Microsoft Corp',sector:'Cloud & Software',price:448.20,prevClose:445.00,high:450.50,low:443.20,volume:410000,marketCap:'$3.33T',availableShares:300 },
      { id:'AMZN',name:'Amazon.com Inc.',sector:'E-Commerce / Cloud',price:186.40,prevClose:184.20,high:187.90,low:183.50,volume:530000,marketCap:'$1.94T',availableShares:400 },
      { id:'GOOGL',name:'Alphabet Inc.',sector:'Internet & AI',price:174.90,prevClose:176.50,high:177.20,low:173.80,volume:390000,marketCap:'$2.18T',availableShares:500 }
    ];

    const INITIAL_USER = {
      id:'usr_demo', name:'Alex Mercer',
      cashBalance: 50000.00,
      portfolio: { NVDA:{shares:20,avgBuyPrice:120.00}, AAPL:{shares:15,avgBuyPrice:215.00}, MSFT:{shares:5,avgBuyPrice:430.00} }
    };

    function generateHistory(stocks) {
      const h = {}; const now = Date.now();
      stocks.forEach(s => {
        const pts = []; let c = s.price;
        for (let i = 30; i >= 0; i--) {
          c = Math.max(1, c + (Math.random()-0.49)*(c*0.007));
          pts.push({ stockId:s.id, price:+c.toFixed(2), timestamp: new Date(now-i*30000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}) });
        }
        h[s.id] = pts;
      });
      return h;
    }

    function generateOrderBook(stocks) {
      const book = {};
      stocks.forEach(s => {
        const bids=[], asks=[];
        for (let i=1;i<=6;i++) {
          const bp = +(s.price - i*(s.price*0.0025)).toFixed(2);
          const bq = Math.floor(Math.random()*50)+5;
          bids.push({price:bp,quantity:bq,total:+(bp*bq).toFixed(2)});
          const ap = +(s.price + i*(s.price*0.0025)).toFixed(2);
          const aq = Math.floor(Math.random()*50)+5;
          asks.push({price:ap,quantity:aq,total:+(ap*aq).toFixed(2)});
        }
        bids.sort((a,b)=>b.price-a.price);
        asks.sort((a,b)=>a.price-b.price);
        book[s.id]={bids,asks};
      });
      return book;
    }

    // ═══════════════════════════════════════════════════════════
    //  DATABASE ENGINE (PostgreSQL Simulation)
    // ═══════════════════════════════════════════════════════════
    class DatabaseEngine {
      constructor() {
        this.stocks=[...INITIAL_STOCKS];
        this.user=JSON.parse(JSON.stringify(INITIAL_USER));
        this.priceHistory=generateHistory(this.stocks);
        this.orderBook=generateOrderBook(this.stocks);
        this.trades=[];
        this.logs=[];
        this.activeLocks=new Set();
        this.listeners=new Set();
        this.botEnabled=true;
        this.addLog('SYSTEM','PostgreSQL Exchange Engine initialized — Isolation Level: READ COMMITTED');
        this.addLog('TRIGGER','Registered AFTER INSERT ON Trades → trg_update_portfolio_on_trade');
        this.addLog('TRIGGER','Registered AFTER INSERT ON Trades → trg_record_price_history');
      }
      subscribe(fn){this.listeners.add(fn);return()=>this.listeners.delete(fn)}
      notify(){this.listeners.forEach(fn=>fn())}
      addLog(type,msg,dur=1.2){
        this.logs.unshift({id:'l_'+Math.random().toString(36).substr(2,7),timestamp:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',fractionalSecondDigits:3}),type,message:msg,durationMs:dur});
        if(this.logs.length>100)this.logs.pop();
        this.notify();
      }
      queryRank(){
        const items=this.stocks.map(s=>{const c=s.price-s.prevClose;return{...s,change:c,pctChange:(c/s.prevClose)*100}});
        const g=[...items].sort((a,b)=>b.pctChange-a.pctChange);
        g.forEach((x,i)=>x.rankGainer=i+1);
        return{gainers:g};
      }
      queryRollingAvg(sid){
        const pts=this.priceHistory[sid]||[];
        return pts.map((pt,i,arr)=>{
          const prev=i>0?arr[i-1].price:pt.price;
          const lagDiff=+(pt.price-prev).toFixed(2);
          const s5=arr.slice(Math.max(0,i-4),i+1);
          const ma5=+(s5.reduce((a,x)=>a+x.price,0)/s5.length).toFixed(2);
          const s20=arr.slice(Math.max(0,i-19),i+1);
          const ma20=+(s20.reduce((a,x)=>a+x.price,0)/s20.length).toFixed(2);
          return{...pt,prevPrice:prev,lagDiff,ma5,ma20};
        });
      }
      executeOrder({stockId,type,orderType,price,quantity}){
        const cost=price*quantity;
        const stock=this.stocks.find(s=>s.id===stockId);
        if(!stock)return{success:false,error:'Symbol not found.'};
        this.addLog('TRANSACTION','BEGIN TRANSACTION ISOLATION LEVEL READ COMMITTED;');
        this.addLog('SQL',`SELECT * FROM stocks WHERE id = '${stockId}' FOR UPDATE;`);
        this.activeLocks.add(stockId);
        try{
          if(type==='BUY'){
            if(this.user.cashBalance<cost){this.addLog('SQL',`ROLLBACK; — Insufficient funds ($${this.user.cashBalance.toFixed(2)} < $${cost.toFixed(2)})`);this.activeLocks.delete(stockId);return{success:false,error:`Insufficient cash. Need $${cost.toFixed(2)}.`}}
            if(stock.availableShares<quantity){this.addLog('SQL',`ROLLBACK; — Insufficient liquidity`);this.activeLocks.delete(stockId);return{success:false,error:`Only ${stock.availableShares} shares available.`}}
          } else {
            const held=this.user.portfolio[stockId]?.shares||0;
            if(held<quantity){this.addLog('SQL',`ROLLBACK; — Insufficient position (${held} held)`);this.activeLocks.delete(stockId);return{success:false,error:`You only own ${held} shares.`}}
          }
          const tp=orderType==='MARKET'?stock.price:price;
          const tv=tp*quantity;
          const tr={id:'trd_'+Math.random().toString(36).substr(2,7),stockId,type,orderType,price:tp,quantity,total:tv,timestamp:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})};
          this.trades.unshift(tr);
          this.addLog('SQL',`INSERT INTO Trades VALUES ('${tr.id}','${stockId}','${type}',${tp},${quantity},${tv});`);
          this._triggerPortfolio(stockId,type,quantity,tp);
          this._triggerPriceHistory(stockId,tp);
          if(type==='BUY')stock.availableShares-=quantity; else stock.availableShares+=quantity;
          this.addLog('TRANSACTION',`COMMIT; — Trade #${tr.id} settled ✓`);
          this.activeLocks.delete(stockId);
          this.notify();
          return{success:true,trade:tr};
        }catch(e){this.addLog('SQL',`ROLLBACK; — ${e.message}`);this.activeLocks.delete(stockId);return{success:false,error:e.message}}
      }
      _triggerPortfolio(sid,type,qty,tp){
        this.addLog('TRIGGER',`trg_update_portfolio_on_trade('${sid}','${type}',${qty},${tp})`);
        if(type==='BUY'){
          this.user.cashBalance-=qty*tp;
          const ex=this.user.portfolio[sid]||{shares:0,avgBuyPrice:0};
          const ns=ex.shares+qty;
          const na=((ex.shares*ex.avgBuyPrice)+(qty*tp))/ns;
          this.user.portfolio[sid]={shares:ns,avgBuyPrice:+na.toFixed(2)};
        }else{
          this.user.cashBalance+=qty*tp;
          const ex=this.user.portfolio[sid];
          if(ex){ex.shares-=qty;if(ex.shares<=0)delete this.user.portfolio[sid]}
        }
      }
      _triggerPriceHistory(sid,tp){
        this.addLog('TRIGGER',`trg_record_price_history('${sid}',${tp})`);
        const s=this.stocks.find(x=>x.id===sid);
        if(s){s.price=tp;if(tp>s.high)s.high=tp;if(tp<s.low)s.low=tp;s.volume+=Math.floor(Math.random()*40)+10}
        if(!this.priceHistory[sid])this.priceHistory[sid]=[];
        this.priceHistory[sid].push({stockId:sid,price:tp,timestamp:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})});
        if(this.priceHistory[sid].length>40)this.priceHistory[sid].shift();
      }
      async simulateRace(sid='TSLA'){
        const s=this.stocks.find(x=>x.id===sid);
        const avail=s?s.availableShares:5;
        this.addLog('SYSTEM',`══════ RACE CONDITION: 2 Threads → ${avail} ${sid} Shares ══════`);
        this.addLog('SQL',`[Thread 1] BEGIN; SELECT * FROM stocks WHERE id='${sid}' FOR UPDATE; — Lock ACQUIRED ✓`);
        this.activeLocks.add(sid);
        this.addLog('SQL',`[Thread 2] BEGIN; SELECT * FROM stocks WHERE id='${sid}' FOR UPDATE; — BLOCKED ⏳ Waiting...`);
        this.notify();
        await new Promise(r=>setTimeout(r,900));
        const r1=this.executeOrder({stockId:sid,type:'BUY',orderType:'MARKET',price:s.price,quantity:Math.max(1,avail)});
        this.addLog('SYSTEM','[Thread 1] Committed & Released lock ✓');
        this.notify();
        await new Promise(r=>setTimeout(r,700));
        this.addLog('SQL','[Thread 2] Lock acquired! Checking available shares...');
        const rem=s.availableShares;
        let r2;
        if(rem<10){
          this.addLog('SQL',`[Thread 2] ROLLBACK; — Insufficient supply after Thread 1 commit (${rem} remaining)`);
          r2={success:false,error:`Concurrent Order Failed: Only ${rem} shares remain. Atomic Rollback.`};
        }else{
          r2=this.executeOrder({stockId:sid,type:'BUY',orderType:'MARKET',price:s.price,quantity:10});
        }
        this.notify();
        return{thread1:r1,thread2:r2};
      }
      tickBot(){
        if(!this.botEnabled)return;
        const s=this.stocks[Math.floor(Math.random()*this.stocks.length)];
        const pct=(Math.random()-0.48)*0.01;
        const np=+(s.price*(1+pct)).toFixed(2);
        if(np>0)this._triggerPriceHistory(s.id,np);
        // Update orderbook
        const ob=this.orderBook[s.id];
        if(ob){
          ob.bids=ob.bids.map((b,i)=>{const p=+(np-(i+1)*(np*0.0025)).toFixed(2);const q=Math.floor(Math.random()*50)+5;return{price:p,quantity:q,total:+(p*q).toFixed(2)}});
          ob.asks=ob.asks.map((a,i)=>{const p=+(np+(i+1)*(np*0.0025)).toFixed(2);const q=Math.floor(Math.random()*50)+5;return{price:p,quantity:q,total:+(p*q).toFixed(2)}});
        }
      }
      addStock(d){
        this.addLog('SQL',`INSERT INTO stocks VALUES ('${d.id}','${d.name}','${d.sector}',${d.price});`);
        const ns={...d,prevClose:d.price,high:d.price,low:d.price,volume:0,availableShares:300,marketCap:'N/A'};
        this.stocks.push(ns);
        this.priceHistory[d.id]=[{stockId:d.id,price:d.price,timestamp:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}];
        this.orderBook[d.id]=generateOrderBook([ns])[d.id];
        this.notify();
      }
      marketShock(type){
        const m=type==='BULL'?1.08:type==='CRASH'?0.90:(Math.random()>0.5?1.12:0.85);
        this.addLog('SYSTEM',`⚡ ADMIN Market Shock: ${type} (×${m.toFixed(2)})`);
        this.stocks.forEach(s=>this._triggerPriceHistory(s.id,+(s.price*m).toFixed(2)));
        this.notify();
      }
    }
    const db = new DatabaseEngine();

    // ═══════════════════════════════════════════════════════════
    //  ANIMATED COUNTER COMPONENT
    // ═══════════════════════════════════════════════════════════
    function AnimatedNumber({ value, prefix='', suffix='', decimals=2, className='' }) {
      const [display, setDisplay] = useState(value);
      const prevRef = useRef(value);
      const [flash, setFlash] = useState('');

      useEffect(() => {
        if (value !== prevRef.current) {
          setFlash(value > prevRef.current ? 'text-emerald-400' : 'text-rose-400');
          setTimeout(() => setFlash(''), 600);
        }
        prevRef.current = value;

        let start = display;
        const end = value;
        const diff = end - start;
        const steps = 12;
        let step = 0;
        const timer = setInterval(() => {
          step++;
          const progress = step / steps;
          const eased = 1 - Math.pow(1 - progress, 3);
          setDisplay(start + diff * eased);
          if (step >= steps) { clearInterval(timer); setDisplay(end); }
        }, 25);
        return () => clearInterval(timer);
      }, [value]);

      return (
        <span className={`counter-animate font-mono ${flash || className}`}>
          {prefix}{typeof display === 'number' ? display.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) : display}{suffix}
        </span>
      );
    }

    // ═══════════════════════════════════════════════════════════
    //  CHART PANEL
    // ═══════════════════════════════════════════════════════════
    function ChartPanel({ stock, windowData }) {
      const ref = useRef(null);
      const chartRef = useRef(null);
      const [showMA5,setMA5] = useState(true);
      const [showMA20,setMA20] = useState(true);

      useEffect(()=>{
        if(!ref.current)return;
        const ctx=ref.current.getContext('2d');
        if(chartRef.current)chartRef.current.destroy();

        const labels=windowData.map(p=>p.timestamp);
        const prices=windowData.map(p=>p.price);
        const isUp=prices.length>1?prices[prices.length-1]>=prices[0]:true;

        const grad=ctx.createLinearGradient(0,0,0,300);
        if(isUp){grad.addColorStop(0,'rgba(16,185,129,0.15)');grad.addColorStop(1,'rgba(16,185,129,0)');}
        else{grad.addColorStop(0,'rgba(244,63,94,0.15)');grad.addColorStop(1,'rgba(244,63,94,0)');}

        const datasets=[{
          label:`${stock.id}`,data:prices,borderColor:isUp?'#10b981':'#f43f5e',
          backgroundColor:grad,fill:true,tension:0.4,borderWidth:2.5,pointRadius:0,pointHoverRadius:6,
          pointHoverBackgroundColor:isUp?'#10b981':'#f43f5e',pointHoverBorderColor:'#fff',pointHoverBorderWidth:2
        }];

        if(showMA5) datasets.push({
          label:'MA-5',data:windowData.map(p=>p.ma5),borderColor:'#38bdf8',borderDash:[5,5],
          fill:false,tension:0.4,borderWidth:1.5,pointRadius:0
        });
        if(showMA20) datasets.push({
          label:'MA-20',data:windowData.map(p=>p.ma20),borderColor:'#a78bfa',borderDash:[8,4],
          fill:false,tension:0.4,borderWidth:1.5,pointRadius:0
        });

        chartRef.current=new Chart(ctx,{
          type:'line',data:{labels,datasets},
          options:{
            responsive:true,maintainAspectRatio:false,
            interaction:{mode:'index',intersect:false},
            plugins:{
              legend:{display:false},
              tooltip:{
                backgroundColor:'rgba(15,23,42,0.95)',borderColor:'#1e293b',borderWidth:1,
                titleColor:'#94a3b8',bodyColor:'#f8fafc',
                titleFont:{family:'JetBrains Mono',size:11},bodyFont:{family:'JetBrains Mono',size:12,weight:'bold'},
                padding:12,cornerRadius:12,displayColors:true,
                callbacks:{label:function(ctx){return`  ${ctx.dataset.label}: $${ctx.parsed.y.toFixed(2)}`}}
              }
            },
            scales:{
              x:{grid:{color:'rgba(30,41,59,0.3)',drawBorder:false},ticks:{color:'#475569',font:{family:'JetBrains Mono',size:9},maxRotation:0,maxTicksLimit:8}},
              y:{grid:{color:'rgba(30,41,59,0.3)',drawBorder:false},ticks:{color:'#475569',font:{family:'JetBrains Mono',size:10},callback:v=>`$${v.toFixed(0)}`},position:'right'}
            }
          }
        });
        return()=>{if(chartRef.current)chartRef.current.destroy()};
      },[stock,windowData,showMA5,showMA20]);

      return(
        <div className="glass glass-hover rounded-2xl p-5 shadow-xl flex flex-col h-full">
          <div className="flex flex-wrap items-center justify-between gap-3 mb-3 pb-3 border-b border-slate-800/60">
            <div className="flex items-center space-x-2">
              <div className="w-7 h-7 rounded-lg bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center">
                <i className="fa-solid fa-chart-line text-cyan-400 text-xs"></i>
              </div>
              <h3 className="font-bold text-white text-sm tracking-tight">Price Chart</h3>
              <div className="live-dot"></div>
            </div>
            <div className="flex items-center space-x-2 text-[11px] font-mono">
              <span className="text-slate-500 text-[10px] font-sans">PostgreSQL Window:</span>
              <button onClick={()=>setMA5(!showMA5)} className={`px-2 py-0.5 rounded-lg border transition-all ${showMA5?'bg-cyan-950/60 text-cyan-300 border-cyan-700/50 font-bold':'bg-slate-900/50 border-slate-800 text-slate-500'}`}>
                <span className="inline-block w-2 h-0.5 bg-cyan-400 mr-1 rounded" style={{borderBottom:'2px dashed #38bdf8'}}></span>MA-5
              </button>
              <button onClick={()=>setMA20(!showMA20)} className={`px-2 py-0.5 rounded-lg border transition-all ${showMA20?'bg-purple-950/60 text-purple-300 border-purple-700/50 font-bold':'bg-slate-900/50 border-slate-800 text-slate-500'}`}>
                <span className="inline-block w-2 h-0.5 bg-purple-400 mr-1 rounded"></span>MA-20
              </button>

            <span>AVG(price) OVER (PARTITION BY stock_id ORDER BY timestamp)</span>

    // ═══════════════════════════════════════════════════════════
    //  ORDER BOOK
    // ═══════════════════════════════════════════════════════════
    function OrderBookPanel({ stock, book }) {
      const { bids=[], asks=[] } = book||{};
      const maxAsk = asks.reduce((m,a)=>Math.max(m,a.quantity),1);
      const maxBid = bids.reduce((m,b)=>Math.max(m,b.quantity),1);
      const spread = Math.abs((asks[0]?.price||stock.price)-(bids[0]?.price||stock.price));

      return(
        <div className="glass glass-hover rounded-2xl p-4 shadow-xl font-mono text-xs flex flex-col h-full">
          <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-800/60">
            <div className="flex items-center space-x-2">
              <div className="w-6 h-6 rounded-lg bg-slate-800/80 flex items-center justify-center">
                <i className="fa-solid fa-bars-staggered text-cyan-400 text-[10px]"></i>
              </div>
              <h3 className="font-bold text-slate-200 text-sm font-sans">Depth</h3>
            </div>
            <div className="live-dot"></div>
          </div>

          <div className="text-[9px] text-slate-500 uppercase flex justify-between mb-1 px-1 tracking-wider">
            <span>Price ($)</span><span>Size</span>
          </div>

          {/* Asks */}
          <div className="space-y-0.5 mb-1">
            {asks.slice(0,5).reverse().map((a,i)=>(
              <div key={i} className="order-row flex justify-between py-1 px-1.5 rounded-lg relative overflow-hidden">
                <div className="depth-bar-ask absolute inset-0 rounded-lg" style={{width:`${Math.min(100,(a.quantity/maxAsk)*100)}%`,right:0,left:'auto'}}></div>
                <span className="text-rose-400 font-bold relative z-10">{a.price.toFixed(2)}</span>
                <span className="text-slate-400 relative z-10">{a.quantity}</span>
              </div>
            ))}
          </div>

          {/* Spread */}
          <div className="bg-slate-900/80 border border-slate-800/60 rounded-xl py-2 px-3 my-2 text-center shimmer-bg">
            <div className="text-white font-black text-base">
              <AnimatedNumber value={stock.price} prefix="$" className="text-white" />
            </div>
            <div className="text-[10px] text-slate-500 mt-0.5">Spread: <span className="text-cyan-400 font-bold">${spread.toFixed(2)}</span></div>
          </div>

          {/* Bids */}
          <div className="space-y-0.5 mt-1">
            {bids.slice(0,5).map((b,i)=>(
              <div key={i} className="order-row flex justify-between py-1 px-1.5 rounded-lg relative overflow-hidden">
                <div className="depth-bar-bid absolute inset-0 rounded-lg" style={{width:`${Math.min(100,(b.quantity/maxBid)*100)}%`,right:0,left:'auto'}}></div>
                <span className="text-emerald-400 font-bold relative z-10">{b.price.toFixed(2)}</span>
                <span className="text-slate-400 relative z-10">{b.quantity}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════
    //  ORDER FORM
    // ═══════════════════════════════════════════════════════════
    function OrderFormPanel({ stock, user, onOrder }) {
      const [side,setSide]=useState('BUY');
      const [qty,setQty]=useState(5);
      const [orderType,setOrderType]=useState('MARKET');
      const [limitPrice,setLimitPrice]=useState(stock.price);

      const activePrice=orderType==='MARKET'?stock.price:limitPrice;
      const total=qty*activePrice;
      const held=user.portfolio[stock.id]?.shares||0;
      const canAfford=side==='BUY'?user.cashBalance>=total:held>=qty;

      const handleMax=(pct)=>{
        if(side==='BUY'){setQty(Math.max(1,Math.floor((user.cashBalance*pct)/activePrice)))}
        else{setQty(Math.max(1,Math.floor(held*pct)))}
      };

      const submit=(e)=>{
        e.preventDefault();
        if(qty<=0)return;
        onOrder({stockId:stock.id,type:side,orderType,price:activePrice,quantity:parseInt(qty)});
      };

      return(
        <div className="glass glass-hover rounded-2xl p-4 shadow-xl flex flex-col justify-between h-full">
          <div>
            {/* BUY / SELL tabs */}
            <div className="grid grid-cols-2 gap-1.5 mb-3 bg-slate-900/50 p-1 rounded-xl border border-slate-800/60">
              <button onClick={()=>setSide('BUY')}
                className={`py-2 rounded-lg font-black text-xs uppercase tracking-wider transition-all flex items-center justify-center space-x-1.5 ${
                  side==='BUY'?'bg-gradient-to-r from-emerald-600 to-emerald-500 text-white shadow-lg shadow-emerald-500/30 btn-glow-green':'text-slate-500 hover:text-slate-300'
                }`}>
                <i className="fa-solid fa-arrow-trend-up text-[10px]"></i><span>Buy</span>
              </button>
              <button onClick={()=>setSide('SELL')}
                className={`py-2 rounded-lg font-black text-xs uppercase tracking-wider transition-all flex items-center justify-center space-x-1.5 ${
                  side==='SELL'?'bg-gradient-to-r from-rose-600 to-rose-500 text-white shadow-lg shadow-rose-500/30 btn-glow-red':'text-slate-500 hover:text-slate-300'
                }`}>
                <i className="fa-solid fa-arrow-trend-down text-[10px]"></i><span>Sell</span>
              </button>
            </div>

            {/* Order Type */}
            <div className="flex items-center justify-between mb-3">
              <span className="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Type</span>
              <div className="flex bg-slate-900/50 rounded-lg p-0.5 border border-slate-800/60">
                {['MARKET','LIMIT'].map(t=>(
                  <button key={t} onClick={()=>setOrderType(t)}
                    className={`px-2.5 py-1 rounded-md text-[11px] font-mono font-bold transition-all ${orderType===t?'bg-cyan-500/15 text-cyan-300 border border-cyan-500/30':'text-slate-500'}`}>
                    {t}
                  </button>
                ))}
              </div>
            </div>

            <form onSubmit={submit} className="space-y-3 text-xs font-mono">
              {orderType==='LIMIT'&&(
                <div>
                  <label className="block text-[10px] text-slate-500 mb-1 font-sans uppercase tracking-wider">Limit Price ($)</label>
                  <input type="number" step="0.01" value={limitPrice} onChange={e=>setLimitPrice(parseFloat(e.target.value)||0)}
                    className="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500/20 transition-all" />
                </div>
              )}

              <div>
                <div className="flex justify-between mb-1">
                  <label className="text-[10px] text-slate-500 font-sans uppercase tracking-wider">Shares</label>
                  <span className="text-[10px] text-slate-500 font-mono">{side==='BUY'?`Avail: ${stock.availableShares}`:`Held: ${held}`}</span>
                </div>
                <input type="number" min="1" value={qty} onChange={e=>setQty(parseInt(e.target.value)||0)}
                  className="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500/20 transition-all" />
              </div>

              <div className="grid grid-cols-4 gap-1">
                {[0.25,0.50,0.75,1.0].map(p=>(
                  <button key={p} type="button" onClick={()=>handleMax(p)}
                    className="bg-slate-900/60 hover:bg-slate-800 text-slate-400 hover:text-white py-1 rounded-lg border border-slate-800/60 transition-all active:scale-95 text-[10px] font-bold">
                    {p*100}%
                  </button>
                ))}
              </div>

              <div className="bg-slate-900/40 border border-slate-800/40 rounded-xl p-2.5 space-y-1 text-[11px]">
                <div className="flex justify-between text-slate-500"><span>Price:</span><span className="text-slate-300">${activePrice.toFixed(2)}</span></div>
                <div className="flex justify-between text-slate-500"><span>Total:</span><span className="text-cyan-300 font-bold">${total.toFixed(2)}</span></div>
              </div>

              <button type="submit" disabled={!canAfford||qty<=0}
                className={`w-full py-2.5 rounded-xl font-black text-xs uppercase tracking-wider transition-all active:scale-[0.97] ${
                  !canAfford||qty<=0?'bg-slate-800/60 text-slate-600 cursor-not-allowed':
                  side==='BUY'?'bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white btn-glow-green':
                  'bg-gradient-to-r from-rose-600 to-red-500 hover:from-rose-500 hover:to-red-400 text-white btn-glow-red'
                }`}>
                <i className={`fa-solid ${side==='BUY'?'fa-shield-halved':'fa-arrow-right-from-bracket'} mr-1.5`}></i>
                {side} {stock.id}
              </button>
            </form>
          </div>

          <div className="mt-3 pt-2 border-t border-slate-800/40 text-[10px] text-cyan-500/60 font-mono flex items-center space-x-1">
            <i className="fa-solid fa-lock text-[8px]"></i>
            <span>Protected by SELECT ... FOR UPDATE</span>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════
    //  PORTFOLIO VIEW
    // ═══════════════════════════════════════════════════════════
    function PortfolioView({ user, stocks, onOrder, setSelId, setTab }) {
      let totalValue=0, totalCost=0;
      const holdings=Object.entries(user.portfolio).map(([sym,d])=>{
        const st=stocks.find(s=>s.id===sym)||{price:d.avgBuyPrice,name:sym};
        const cv=d.shares*st.price; const cb=d.shares*d.avgBuyPrice;
        const pnl=cv-cb; const pnlPct=cb>0?(pnl/cb)*100:0;
        totalValue+=cv; totalCost+=cb;
        return{sym,name:st.name,shares:d.shares,avg:d.avgBuyPrice,curr:st.price,value:cv,pnl,pnlPct};
      });
      const totalPnl=totalValue-totalCost;
      const netWorth=user.cashBalance+totalValue;

      return(
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            {[
              {label:'Net Worth',value:netWorth,icon:'fa-gem',gradient:'from-cyan-500/15 to-blue-500/15',border:'border-cyan-800/30',color:'text-white'},
              {label:'Cash Balance',value:user.cashBalance,icon:'fa-vault',gradient:'from-emerald-500/15 to-green-500/15',border:'border-emerald-800/30',color:'text-emerald-400'},
              {label:'Portfolio Equity',value:totalValue,icon:'fa-chart-pie',gradient:'from-blue-500/15 to-violet-500/15',border:'border-blue-800/30',color:'text-blue-400'},
              {label:'Unrealized P&L',value:totalPnl,icon:totalPnl>=0?'fa-arrow-trend-up':'fa-arrow-trend-down',gradient:totalPnl>=0?'from-emerald-500/15 to-teal-500/15':'from-rose-500/15 to-red-500/15',border:totalPnl>=0?'border-emerald-800/30':'border-rose-800/30',color:totalPnl>=0?'text-emerald-400':'text-rose-400'}
            ].map((c,i)=>(
              <div key={i} className={`glass glass-hover rounded-2xl p-5 shadow-xl bg-gradient-to-br ${c.gradient} border ${c.border}`} style={{animationDelay:`${i*80}ms`}}>
                <div className="flex justify-between items-center mb-2">
                  <span className="text-[10px] text-slate-400 uppercase tracking-widest font-bold">{c.label}</span>
                  <i className={`fa-solid ${c.icon} ${c.color} text-sm`}></i>
                </div>
                <div className={`text-2xl font-black font-mono ${c.color}`}>
                  <AnimatedNumber value={c.value} prefix={c.label==='Unrealized P&L'?(c.value>=0?'+$':'$'):'$'} className={c.color} />
                </div>
              </div>
            ))}
          </div>

          <div className="glass glass-hover rounded-2xl p-6 shadow-xl">
            <h3 className="text-lg font-bold text-white mb-4 flex items-center space-x-2">
              <i className="fa-solid fa-briefcase text-cyan-400"></i>
              <span>Active Positions</span>
            </h3>
            {holdings.length===0?(
              <div className="text-center py-16 text-slate-600"><i className="fa-solid fa-inbox text-4xl mb-3 block"></i><p className="font-mono">No positions. Start trading!</p></div>
            ):(
              <div className="overflow-x-auto">
                <table className="w-full text-left font-mono text-xs">
                  <thead><tr className="border-b border-slate-800/60 text-slate-500 uppercase text-[10px] tracking-wider">
                    <th className="py-3 px-3 font-sans font-bold">Asset</th><th className="py-3 px-3 text-right font-sans font-bold">Shares</th>
                    <th className="py-3 px-3 text-right font-sans font-bold">Avg Price</th><th className="py-3 px-3 text-right font-sans font-bold">Current</th>
                    <th className="py-3 px-3 text-right font-sans font-bold">Value</th><th className="py-3 px-3 text-right font-sans font-bold">P&L</th>
                    <th className="py-3 px-3 text-center font-sans font-bold">Action</th>
                  </tr></thead>
                  <tbody className="divide-y divide-slate-800/40">
                    {holdings.map(h=>{
                      const up=h.pnl>=0;
                      return(
                        <tr key={h.sym} className="hover:bg-slate-800/20 transition-all group">
                          <td className="py-3.5 px-3">
                            <button onClick={()=>{setSelId(h.sym);setTab('terminal')}} className="flex items-center space-x-2 group-hover:text-cyan-300 transition-colors">
                              <div className="w-7 h-7 rounded-lg flex items-center justify-center" style={{background:`${STOCK_COLORS[h.sym]||'#38bdf8'}15`,border:`1px solid ${STOCK_COLORS[h.sym]||'#38bdf8'}30`}}>
                                <i className={`fa-solid ${STOCK_ICONS[h.sym]||'fa-chart-simple'} text-[10px]`} style={{color:STOCK_COLORS[h.sym]}}></i>
                              </div>
                              <div><span className="font-bold text-cyan-400 text-sm">{h.sym}</span><br/><span className="text-[10px] text-slate-500 font-sans">{h.name}</span></div>
                            </button>
                          </td>
                          <td className="py-3.5 px-3 text-right font-bold text-white">{h.shares}</td>
                          <td className="py-3.5 px-3 text-right text-slate-400">${h.avg.toFixed(2)}</td>
                          <td className="py-3.5 px-3 text-right text-white font-bold">${h.curr.toFixed(2)}</td>
                          <td className="py-3.5 px-3 text-right text-white font-bold">${h.value.toFixed(2)}</td>
                          <td className={`py-3.5 px-3 text-right font-bold ${up?'text-emerald-400':'text-rose-400'}`}>
                            {up?'+':''}${h.pnl.toFixed(2)}<br/><span className="text-[10px]">({up?'+':''}{h.pnlPct.toFixed(1)}%)</span>
                          </td>
                          <td className="py-3.5 px-3 text-center">
                            <button onClick={()=>onOrder({stockId:h.sym,type:'SELL',orderType:'MARKET',price:h.curr,quantity:h.shares})}
                              className="bg-rose-950/60 hover:bg-rose-900/80 border border-rose-800/60 text-rose-300 px-3 py-1.5 rounded-xl font-sans font-bold text-[10px] transition-all active:scale-95 shadow hover:shadow-rose-500/10">
                              <i className="fa-solid fa-arrow-right-from-bracket mr-1 text-[9px]"></i>Sell All
                            </button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

            <div className="glass glass-hover rounded-2xl p-6 shadow-xl">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center space-x-2"><i className="fa-solid fa-terminal text-emerald-400"></i><h3 className="font-bold text-white font-sans">Live PostgreSQL Transaction Stream</h3></div>
                <div className="flex items-center space-x-2"><div className="live-dot"></div><span className="text-[10px] text-slate-500 font-mono">{db.logs.length} entries</span></div>
              </div>
              <div className="bg-[#040609] border border-slate-800/60 rounded-xl p-4 h-[460px] overflow-y-auto space-y-1.5 font-mono text-[11px]">
                {db.logs.map((log,i)=>{
                  const colors={SQL:'text-cyan-300 bg-cyan-950/60 border-cyan-800/40',TRIGGER:'text-purple-300 bg-purple-950/60 border-purple-800/40',TRANSACTION:'text-emerald-300 bg-emerald-950/60 border-emerald-800/40',SYSTEM:'text-amber-300 bg-amber-950/60 border-amber-800/40'};
                  const c=colors[log.type]||'text-slate-300 bg-slate-800/60 border-slate-700/40';
                  return(
                    <div key={log.id} className="flex items-start space-x-2 py-1 px-2 hover:bg-slate-800/20 rounded-lg transition-all slide-up" style={{animationDelay:`${i*20}ms`,animationDuration:'0.3s'}}>
                      <span className="text-slate-600 text-[10px] flex-shrink-0 pt-0.5 w-20">{log.timestamp}</span>
                      <span className={`px-1.5 py-0.5 text-[8px] rounded font-black uppercase tracking-widest flex-shrink-0 border ${c}`}>{log.type}</span>
                      <span className="text-slate-300 break-all leading-relaxed flex-1">{log.message}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════
    //  ADMIN VIEW
    // ═══════════════════════════════════════════════════════════
    function AdminView({ db }) {
      const [ticker,setTicker]=useState('');
      const [name,setName]=useState('');
      const [price,setPrice]=useState(150);
      const [msg,setMsg]=useState('');

      const submit=(e)=>{
        e.preventDefault();
        if(!ticker||!name)return;
        if(db.stocks.some(s=>s.id===ticker.toUpperCase())){setMsg('Ticker already exists!');return}
        db.addStock({id:ticker.toUpperCase().trim(),name,sector:'Technology',price:parseFloat(price),totalSupply:10000});
        setMsg(`${ticker.toUpperCase()} listed successfully! ✓`);
        setTicker('');setName('');
        setTimeout(()=>setMsg(''),3000);
      };

      return(
        <div className="space-y-6">
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            {[
              {label:'Exchange Volume',value:db.stocks.reduce((s,x)=>s+x.volume,0).toLocaleString()+' shares',icon:'fa-chart-bar',color:'text-cyan-400',bg:'from-cyan-500/10 to-blue-500/10'},
              {label:'Trades Executed',value:db.trades.length,icon:'fa-bolt',color:'text-emerald-400',bg:'from-emerald-500/10 to-green-500/10'},
              {label:'Active Locks',value:db.activeLocks.size,icon:'fa-lock',color:'text-amber-400',bg:'from-amber-500/10 to-orange-500/10'}
            ].map((c,i)=>(
              <div key={i} className={`glass glass-hover rounded-2xl p-5 shadow-xl bg-gradient-to-br ${c.bg}`}>
                <div className="flex justify-between items-center mb-1"><span className="text-[10px] text-slate-500 uppercase tracking-widest font-bold">{c.label}</span><i className={`fa-solid ${c.icon} ${c.color}`}></i></div>
                <div className={`text-2xl font-black font-mono ${c.color}`}>{c.value}</div>
              </div>
            ))}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="glass glass-hover rounded-2xl p-6 shadow-xl">
              <div className="flex items-center space-x-2 mb-4 pb-3 border-b border-slate-800/60"><i className="fa-solid fa-plus-circle text-cyan-400"></i><h3 className="font-bold text-white">List New Stock</h3></div>
              {msg&&<div className="mb-3 p-3 bg-cyan-950/60 border border-cyan-800/40 text-cyan-300 rounded-xl text-xs font-mono">{msg}</div>}
              <form onSubmit={submit} className="space-y-3 font-mono text-xs">
                <input type="text" placeholder="Ticker (e.g. AMD)" value={ticker} onChange={e=>setTicker(e.target.value)} className="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl px-3 py-2 text-white uppercase focus:outline-none focus:border-cyan-500" required />
                <input type="text" placeholder="Company Name" value={name} onChange={e=>setName(e.target.value)} className="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-500" required />
                <input type="number" placeholder="Price ($)" value={price} onChange={e=>setPrice(e.target.value)} className="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-500" required />
                <button type="submit" className="w-full py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-black rounded-xl uppercase tracking-wider text-xs transition-all active:scale-[0.97] shadow-lg shadow-cyan-600/20">
                  <i className="fa-solid fa-rocket mr-1.5"></i>List on Exchange
                </button>
              </form>
            </div>

            <div className="glass glass-hover rounded-2xl p-6 shadow-xl flex flex-col justify-between">
              <div>
                <div className="flex items-center space-x-2 mb-4 pb-3 border-b border-slate-800/60"><i className="fa-solid fa-explosion text-amber-400"></i><h3 className="font-bold text-white">Market Shock Simulator</h3></div>
                <p className="text-xs text-slate-500 mb-4 leading-relaxed">Inject macroeconomic events across all PostgreSQL stock records.</p>
                <div className="grid grid-cols-3 gap-3">
                  {[
                    {type:'BULL',icon:'fa-arrow-trend-up',label:'+8% Bull Rally',color:'emerald'},
                    {type:'CRASH',icon:'fa-arrow-trend-down',label:'-10% Flash Crash',color:'rose'},
                    {type:'SPIKE',icon:'fa-bolt',label:'Random Spike',color:'amber'}
                  ].map(s=>(
                    <button key={s.type} onClick={()=>db.marketShock(s.type)}
                      className={`p-4 bg-${s.color}-950/40 hover:bg-${s.color}-900/60 border border-${s.color}-700/40 text-${s.color}-300 rounded-xl font-mono text-xs flex flex-col items-center justify-center space-y-2 transition-all active:scale-95 shadow hover:shadow-${s.color}-500/10`}>
                      <i className={`fa-solid ${s.icon} text-${s.color}-400 text-xl`}></i>
                      <span className="font-bold">{s.label}</span>
                    </button>
                  ))}
                </div>
              </div>
              <div className="mt-4 p-3 bg-slate-900/40 border border-slate-800/40 rounded-xl text-[10px] text-slate-500 font-mono flex justify-between items-center">
                <span>Exchange: ONLINE</span>
                <span className="text-emerald-400 font-bold flex items-center"><div className="live-dot mr-1.5"></div>100% Uptime</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════
    //  RENDER
    // ═══════════════════════════════════════════════════════════
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
