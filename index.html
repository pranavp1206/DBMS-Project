<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSim — Group B14 | 23CSE202</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],mono:['JetBrains Mono','monospace']}}}}</script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { background:#0b0f18; color:#e2e8f0; font-family:'Inter',sans-serif; margin:0; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#334155; border-radius:4px; }
  .card { background:#111827; border:1px solid #1f2937; border-radius:10px; }
  .btn { border-radius:8px; font-weight:600; cursor:pointer; transition:background .15s; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  input { font-family:inherit; }
  table { border-collapse:collapse; }
</style>
</head>
<body class="min-h-screen"><div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── CONSTANTS & API RESOLUTION ─────────────────────────────
const BACKEND_URL_KEY = 'stocksim_backend_url';
function getApiBase() {
  const custom = localStorage.getItem(BACKEND_URL_KEY);
  if (custom) return custom.replace(/\/+$/, '');
  // If hosted on localhost or same origin as backend
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    return 'http://localhost:8000';
  }
  // If hosted on GitHub Pages or external domain without custom URL, default to localhost:8000
  return 'http://localhost:8000';
}
let API = getApiBase();

const ICONS  = { NVDA:'fa-microchip', AAPL:'fa-apple-whole', TSLA:'fa-car',
                 MSFT:'fa-windows', AMZN:'fa-box', GOOGL:'fa-magnifying-glass' };
const COLORS = { NVDA:'#76b900', AAPL:'#a2aaad', TSLA:'#cc0000',
                 MSFT:'#00a4ef', AMZN:'#ff9900', GOOGL:'#4285f4' };

const TOKEN_KEY='stocksim_token', USER_KEY='stocksim_user';
const getToken=()=>localStorage.getItem(TOKEN_KEY);
const setToken=t=>localStorage.setItem(TOKEN_KEY,t);
const clearAuth=()=>{localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(USER_KEY)};
const cachedUser=()=>{try{return JSON.parse(localStorage.getItem(USER_KEY)||'null')}catch{return null}};

const fmt=(n,d=2)=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

// ─── API WRAPPER ────────────────────────────────────────────
async function api(path, opts={}) {
  const headers = { 'Content-Type':'application/json', ...(opts.headers||{}) };
  const token = getToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const baseUrl = getApiBase();
  const res = await fetch(baseUrl + path, { ...opts, headers }).catch(err => {
    if (window.location.hostname.endsWith('github.io') && baseUrl.includes('localhost')) {
      throw new Error(`Cannot reach backend at ${baseUrl}. GitHub Pages runs statically in your browser while the FastAPI + PostgreSQL backend runs on your machine. Start backend.py or configure a live backend URL.`);
    }
    throw new Error(`Failed to connect to backend at ${baseUrl}: ` + err.message);
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/login') { clearAuth(); window.location.reload(); }
  if (!res.ok) throw new Error(data.detail || 'Request failed');
  return data;
}

// ─── APP ────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(cachedUser());
  const [tab, setTab] = useState('terminal');
  const [selId, setSelId] = useState('NVDA');
  const [toast, setToast] = useState(null);
  const [stocks, setStocks] = useState([]);
  const [portfolio, setPortfolio] = useState([]);
  const [trades, setTrades] = useState([]);
  const [orders, setOrders] = useState([]);
  const [dbOnline, setDbOnline] = useState(false);
  const [refreshKey, setRefreshKey] = useState(0);

  const showToast = useCallback((title, msg, type='INFO') => {
    setToast({ title, msg, type });
    setTimeout(() => setToast(null), 3500);
  }, []);

  useEffect(() => {
    if (!user) return;
    let cancel = false;
    async function tick() {
      try {
        const [h, s, p, t, o] = await Promise.all([
          api('/health').catch(() => ({ db:false })),
          api('/stocks').catch(() => []),
          api('/me/portfolio').catch(() => []),
          api('/me/trades?limit=15').catch(() => []),
          api('/me/orders').catch(() => []),
        ]);
        if (cancel) return;
        setDbOnline(h.db);
        setStocks(s); setPortfolio(p); setTrades(t); setOrders(o);
      } catch {}
    }
    tick();
    const iv = setInterval(tick, 2500);
    return () => { cancel = true; clearInterval(iv); };
  }, [user, refreshKey]);

  useEffect(() => {
    if (!user) return;
    const iv = setInterval(async () => {
      try {
        const me = await api('/me');
        setUser(me);
        localStorage.setItem(USER_KEY, JSON.stringify(me));
      } catch {}
    }, 3000);
    return () => clearInterval(iv);
  }, [user]);

  if (!user) return <Login onLogin={u => { setUser(u); localStorage.setItem(USER_KEY, JSON.stringify(u)); }} />;

  const sel = stocks.find(s => s.stock_id === selId) || stocks[0];

  const placeOrder = async (data) => {
    try {
      const r = await api('/orders', { method:'POST', body:JSON.stringify(data) });
      const msg = r.filled_qty > 0
        ? (r.residual_qty > 0 ? `${r.filled_qty} filled, ${r.residual_qty} resting in book` : `All ${r.filled_qty} shares filled! Added to portfolio.`)
        : `${r.residual_qty} shares placed in order book (waiting for a matching counterparty)`;
      showToast(r.filled_qty > 0 ? 'Order Filled' : 'Order Resting in Book', msg, r.filled_qty > 0 ? 'SUCCESS' : 'INFO');
      setRefreshKey(k => k + 1);
    } catch (e) { showToast('Order Failed', e.message, 'ERROR'); }
  };

  const cancelOrder = async (id) => {
    try {
      await api('/orders/' + id, { method:'DELETE' });
      showToast('Cancelled', `Order #${id} released`, 'SUCCESS');
      setRefreshKey(k => k + 1);
    } catch (e) { showToast('Failed', e.message, 'ERROR'); }
  };

  const raceTest = async () => {
    setTab('analytics');
    showToast('Race Test', 'Two barrier-synced buyers...');
    try {
      const r = await api('/simulate/race?stock_id=TSLA', { method:'POST' });
      if (r.thread2 && !r.thread2.success)
        showToast('Race Prevented', r.thread2.error, 'SUCCESS');
      else showToast('Test Complete', 'See SQL log for details', 'INFO');
      setRefreshKey(k => k + 1);
    } catch (e) { showToast('Race Test Failed', e.message, 'ERROR'); }
  };

  const logout = async () => {
    try { await api('/logout', { method:'POST' }); } catch {}
    clearAuth(); window.location.reload();
  };

  const netWorth = parseFloat(user.cash_balance || 0)
    + portfolio.reduce((s, h) => s + parseFloat(h.current_value || 0), 0);

  return (
    <div className="min-h-screen">
      <Header user={user} tab={tab} setTab={setTab} dbOnline={dbOnline}
              onRace={raceTest} onLogout={logout}
              cash={user.cash_balance} netWorth={netWorth} />
      <main className="max-w-[1300px] mx-auto px-4 py-5">
        {stocks.length === 0 ? (
          <div className="flex items-center justify-center py-20 text-slate-500 text-sm">
            <i className="fa-solid fa-circle-notch fa-spin text-cyan-400 text-xl mr-2"></i>
            Loading exchange data...
          </div>
        ) : (
          <>
            {tab === 'terminal' && sel && (
              <Terminal stocks={stocks} sel={sel} setSelId={setSelId}
                        portfolio={portfolio} onOrder={placeOrder}
                        orders={orders} onCancel={cancelOrder} trades={trades} />
            )}
            {tab === 'portfolio' && (
              <Portfolio portfolio={portfolio} cash={user.cash_balance}
                         setSelId={setSelId} setTab={setTab}
                         orders={orders} onCancel={cancelOrder}
                         onCashChange={newBal => {
                           setUser(u => ({ ...u, cash_balance: newBal }));
                           setRefreshKey(k => k + 1);
                         }}
                         toast={showToast} />
            )}
            {tab === 'analytics' && sel && <Analytics sel={sel} />}
            {tab === 'admin' && user.role === 'admin' && (
              <Admin stocks={stocks} refresh={() => setRefreshKey(k => k + 1)} toast={showToast} />
            )}
          </>
        )}
      </main>
      {toast && <Toast data={toast} close={() => setToast(null)} />}
    </div>
  );
}

// ─── LOGIN ──────────────────────────────────────────────────
function Login({ onLogin }) {
  const [mode, setMode] = useState('login');
  const [username, setU] = useState('');
  const [email, setE] = useState('');
  const [password, setP] = useState('');
  const [customCash, setCustomCash] = useState('50000');
  const [customUrl, setCustomUrl]   = useState(localStorage.getItem(BACKEND_URL_KEY) || '');
  const [err, setErr]               = useState('');
  const [busy, setBusy]             = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true); setErr('');
    try {
      const body = mode === 'register'
        ? { username, email, password, initial_cash: parseFloat(customCash) || 50000 }
        : { username, password };
      const r = await api('/' + mode, { method:'POST', body:JSON.stringify(body) });
      setToken(r.token);
      onLogin({ user_id:r.user_id, username:r.username, role:r.role, cash_balance:r.cash_balance });
    } catch (e) { setErr(e.message); setBusy(false); }
  };

  const fill = (u, p) => { setU(u); setP(p); };

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="card p-8 w-full max-w-md">
        <h1 className="text-2xl font-bold text-white mb-1">StockSim</h1>
        <p className="text-xs text-slate-500 mb-6">Group B14 · 23CSE202</p>

        <div className="flex mb-5 bg-slate-900 rounded-lg p-1 text-xs">
          <button onClick={() => setMode('login')}
            className={`flex-1 py-2 rounded-md ${mode === 'login' ? 'bg-cyan-600 text-white' : 'text-slate-400'}`}>Login</button>
          <button onClick={() => setMode('register')}
            className={`flex-1 py-2 rounded-md ${mode === 'register' ? 'bg-cyan-600 text-white' : 'text-slate-400'}`}>Register</button>
        </div>

        <form onSubmit={submit} className="space-y-3 text-sm">
          <div>
            <label className="block text-xs text-slate-500 mb-1">Username</label>
            <input value={username} onChange={e => setU(e.target.value)} required
              autoComplete="username"
              className="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-white focus:outline-none focus:border-cyan-500" />
          </div>
          {mode === 'register' && (
            <div>
              <label className="block text-xs text-slate-500 mb-1">Email</label>
              <input type="email" value={email} onChange={e => setE(e.target.value)} required
                className="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-white focus:outline-none focus:border-cyan-500" />
            </div>
          )}
          {mode === 'register' && (
            <div>
              <div className="flex justify-between items-center mb-1">
                <label className="text-xs text-slate-500">Starting Cash Balance ($)</label>
                <span className="text-[10px] text-cyan-400 font-mono">Default: $50,000</span>
              </div>
              <input type="number" min="0" step="500" value={customCash} onChange={e => setCustomCash(e.target.value)} required
                className="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-white font-mono focus:outline-none focus:border-cyan-500" />
            </div>
          )}
          <div>
            <label className="block text-xs text-slate-500 mb-1">Password</label>
            <input type="password" value={password} onChange={e => setP(e.target.value)} required
              autoComplete="current-password"
              className="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-white focus:outline-none focus:border-cyan-500" />
          </div>
          {err && <p className="text-rose-400 text-xs">{err}</p>}
          <button disabled={busy} type="submit"
            className="btn w-full py-2.5 bg-cyan-600 hover:bg-cyan-700 text-white">
            {busy ? 'Please wait...' : (mode === 'login' ? 'Sign In' : 'Create Account')}
          </button>
        </form>

        <div className="mt-6 pt-4 border-t border-slate-800 text-[11px]">
          <p className="text-slate-500 mb-2">Quick login:</p>
          <div className="grid grid-cols-2 gap-2">
            <button type="button" onClick={() => fill('pranav_trader', 'password123')}
              className="btn py-2 bg-slate-800 hover:bg-slate-700 text-slate-200">Trader: pranav</button>
            <button type="button" onClick={() => fill('bhanu_trader', 'password123')}
              className="btn py-2 bg-slate-800 hover:bg-slate-700 text-slate-200">Trader: bhanu</button>
            <button type="button" onClick={() => fill('navdeep_trader', 'password123')}
              className="btn py-2 bg-slate-800 hover:bg-slate-700 text-slate-200">Trader: navdeep</button>
            <button type="button" onClick={() => fill('admin_exchange', 'admin123')}
              className="btn py-2 bg-slate-800 hover:bg-slate-700 text-amber-300">Admin: admin_exchange</button>
          </div>
        </div>

        <div className="mt-4 pt-3 border-t border-slate-800/60 text-[11px]">
          <div className="flex items-center justify-between text-slate-500">
            <span>API Server:</span>
            <span className="font-mono text-cyan-400">{getApiBase()}</span>
          </div>
          <div className="mt-2 flex gap-1.5">
            <input type="text" placeholder="Custom API URL (e.g. http://localhost:8000)"
              value={customUrl} onChange={e => setCustomUrl(e.target.value)}
              className="flex-1 bg-slate-900 border border-slate-800 rounded px-2 py-1 text-slate-300 text-[10px] font-mono focus:outline-none focus:border-cyan-500" />
            <button type="button" onClick={() => {
              if (customUrl) localStorage.setItem(BACKEND_URL_KEY, customUrl.trim());
              else localStorage.removeItem(BACKEND_URL_KEY);
              window.location.reload();
            }} className="btn px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px]">
              Set
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── HEADER ─────────────────────────────────────────────────
function Header({ user, tab, setTab, dbOnline, onRace, onLogout, cash, netWorth }) {
  const tabs = [
    { id:'terminal',  icon:'fa-chart-line', label:'Terminal' },
    { id:'portfolio', icon:'fa-wallet',     label:'Portfolio' },
    { id:'analytics', icon:'fa-code',       label:'SQL' },
  ];
  if (user.role === 'admin') tabs.push({ id:'admin', icon:'fa-user-shield', label:'Admin' });

  return (
    <header className="border-b border-slate-800 bg-[#0d121c] sticky top-0 z-30">
      <div className="max-w-[1300px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-3">
          <i className="fa-solid fa-database text-cyan-400"></i>
          <div>
            <h1 className="font-bold text-white text-base">StockSim</h1>
            <p className="text-[11px] text-slate-500">
              {user.username} · {user.role} ·
              {dbOnline ? <span className="text-emerald-400 ml-1">connected</span>
                        : <span className="text-amber-400 ml-1">offline</span>}
            </p>
          </div>
        </div>

        <nav className="flex gap-1 bg-slate-900 rounded-lg p-1">
          {tabs.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={`px-3 py-1.5 rounded-md text-xs font-medium ${tab === t.id ? 'bg-cyan-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>
              <i className={`fa-solid ${t.icon} mr-1.5`}></i>{t.label}
            </button>
          ))}
        </nav>

        <div className="flex items-center gap-2 text-xs">
          <button onClick={onRace}
            className="btn px-3 py-1.5 bg-amber-600/20 border border-amber-700 text-amber-300 hover:bg-amber-600/30">
            <i className="fa-solid fa-bolt mr-1"></i>Race Test
          </button>
          <div className="card px-3 py-1.5 flex gap-3">
            <div>
              <div className="text-[10px] text-slate-500 uppercase">Cash</div>
              <div className="font-mono text-emerald-400 font-semibold">${fmt(cash)}</div>
            </div>
            <div className="border-l border-slate-800 pl-3">
              <div className="text-[10px] text-slate-500 uppercase">Net Worth</div>
              <div className="font-mono text-cyan-300 font-semibold">${fmt(netWorth)}</div>
            </div>
          </div>
          <button onClick={onLogout}
            className="btn px-3 py-1.5 bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700">
            <i className="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </header>
  );
}

// ─── TERMINAL ───────────────────────────────────────────────
function Terminal({ stocks, sel, setSelId, portfolio, onOrder, orders, onCancel, trades }) {
  return (
    <div className="space-y-4">
      <div className="card p-4">
        <div className="flex gap-2 overflow-x-auto pb-3 mb-3 border-b border-slate-800">
          <span className="text-[11px] uppercase text-slate-500 font-semibold self-center">Markets</span>
          {stocks.map(s => {
            const isSel = s.stock_id === sel.stock_id;
            const up = s.pct_change >= 0;
            return (
              <button key={s.stock_id} onClick={() => setSelId(s.stock_id)}
                className={`px-3 py-1.5 rounded-md text-xs whitespace-nowrap ${isSel ? 'bg-cyan-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                <i className={`fa-solid ${ICONS[s.stock_id] || 'fa-chart-simple'} mr-1.5`}
                   style={{ color: isSel ? '#fff' : COLORS[s.stock_id] }}></i>
                {s.stock_id}
                <span className={`ml-2 font-mono ${isSel ? 'text-white' : (up ? 'text-emerald-400' : 'text-rose-400')}`}>
                  ${fmt(s.current_price)}
                </span>
              </button>
            );
          })}
        </div>

        <div className="flex flex-wrap items-start justify-between gap-4">
          <div>
            <div className="flex items-center gap-3">
              <i className={`fa-solid ${ICONS[sel.stock_id] || 'fa-chart-simple'} text-2xl`}
                 style={{ color: COLORS[sel.stock_id] }}></i>
              <div>
                <div className="flex items-baseline gap-2">
                  <h2 className="text-xl font-bold font-mono text-white">{sel.stock_id}</h2>
                  <span className="text-sm text-slate-400">{sel.company_name}</span>
                </div>
                <span className="text-[11px] text-slate-500">{sel.sector}</span>
              </div>
            </div>
            <div className="flex items-baseline gap-3 mt-3">
              <span className="text-2xl font-bold font-mono text-white">${fmt(sel.current_price)}</span>
              <span className={`font-mono text-sm font-semibold ${sel.pct_change >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                {sel.pct_change >= 0 ? '+' : ''}{fmt(sel.pct_change)}%
              </span>
            </div>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
            {[
              { l:'24h High', v:'$' + fmt(sel.day_high) },
              { l:'24h Low',  v:'$' + fmt(sel.day_low) },
              { l:'Volume',   v:Number(sel.volume).toLocaleString() },
              { l:'Liquidity', v:sel.available_shares + ' sh', warn: sel.available_shares < 50 }
            ].map((m, i) => (
              <div key={i} className="bg-slate-900 rounded-md p-2.5 border border-slate-800 min-w-[90px]">
                <div className="text-[10px] uppercase text-slate-500 mb-1">{m.l}</div>
                <div className={`font-mono font-semibold ${m.warn ? 'text-rose-400' : 'text-slate-200'}`}>{m.v}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
        <div className="lg:col-span-7"><StockChart stock={sel} /></div>
        <div className="lg:col-span-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
          <OrderBook stock={sel} />
          <OrderForm stock={sel} portfolio={portfolio} onOrder={onOrder} />
        </div>
      </div>

      {orders.length > 0 && (
        <div className="card p-4">
          <h3 className="font-semibold text-sm text-white mb-3">
            <i className="fa-solid fa-hourglass-half text-amber-400 mr-1.5"></i>
            Open Orders <span className="text-slate-500 text-[11px] font-normal ml-2">{orders.length}</span>
          </h3>
          <table className="w-full text-xs font-mono">
            <thead>
              <tr className="text-slate-500 uppercase text-[10px] border-b border-slate-800">
                <th className="text-left py-2 px-2">ID</th>
                <th className="text-left py-2 px-2">Stock</th>
                <th className="text-left py-2 px-2">Side</th>
                <th className="text-right py-2 px-2">Price</th>
                <th className="text-right py-2 px-2">Qty</th>
                <th className="text-right py-2 px-2">Filled</th>
                <th className="text-center py-2 px-2">Action</th>
              </tr>
            </thead>
            <tbody>
              {orders.map(o => (
                <tr key={o.order_id} className="border-b border-slate-800/50">
                  <td className="py-2 px-2 text-slate-500">#{o.order_id}</td>
                  <td className="py-2 px-2 text-white font-semibold">{o.stock_id}</td>
                  <td className={`py-2 px-2 font-semibold ${o.order_type === 'BUY' ? 'text-emerald-400' : 'text-rose-400'}`}>{o.order_type}</td>
                  <td className="py-2 px-2 text-right text-slate-300">${fmt(o.price)}</td>
                  <td className="py-2 px-2 text-right text-slate-300">{o.quantity}</td>
                  <td className="py-2 px-2 text-right text-slate-500">{o.filled_qty}/{o.quantity}</td>
                  <td className="py-2 px-2 text-center">

      )}

      {trades.length > 0 && (
        <div className="card p-4">
          <h3 className="font-semibold text-sm text-white mb-3">
            <i className="fa-solid fa-clock-rotate-left text-cyan-400 mr-1.5"></i>
            Recent Trades
          </h3>
          <div className="flex gap-3 overflow-x-auto">
            {trades.slice(0, 8).map(t => (
              <div key={t.trade_id} className="flex-shrink-0 bg-slate-900 border border-slate-800 rounded-md px-3 py-2 font-mono text-xs">
                <div className="flex gap-2">
                  <span className={t.trade_type === 'BUY' ? 'text-emerald-400' : 'text-rose-400'}>{t.trade_type}</span>
                  <span className="text-white font-semibold">{t.stock_id}</span>

              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── STOCK CHART ────────────────────────────────────────────
function StockChart({ stock }) {
  const ref = useRef(null), chartRef = useRef(null);
  const [data, setData] = useState([]);

  useEffect(() => {
    let cancel = false;
    async function load() {
      try {
        const rows = await api(`/analytics/rolling/${stock.stock_id}?limit=40`);
        if (!cancel) setData(rows);
      } catch {}
    }
    load();
    const iv = setInterval(load, 5000);
    return () => { cancel = true; clearInterval(iv); };
  }, [stock.stock_id]);

  useEffect(() => {
    if (!ref.current || data.length === 0 || !window.Chart) return;
    const ctx = ref.current.getContext('2d');
    if (chartRef.current) chartRef.current.destroy();

    chartRef.current = new window.Chart(ctx, {
      type: 'line',
      data: {
        labels: data.map(p => new Date(p.recorded_at).toLocaleTimeString('en-GB', { hour12:false })),
        datasets: [
          { label: stock.stock_id, data: data.map(p => parseFloat(p.price)),
            borderColor:'#38bdf8', backgroundColor:'rgba(56,189,248,0.08)',
            fill:true, tension:0.3, borderWidth:2, pointRadius:0 },
          { label:'MA-5', data: data.map(p => parseFloat(p.ma_5 || p.price)),
            borderColor:'#f59e0b', borderDash:[4,4], fill:false, tension:0.3, borderWidth:1.2, pointRadius:0 },
          { label:'MA-20', data: data.map(p => parseFloat(p.ma_20 || p.price)),
            borderColor:'#a78bfa', borderDash:[8,4], fill:false, tension:0.3, borderWidth:1.2, pointRadius:0 },
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{
          x:{ grid:{color:'rgba(51,65,85,0.3)'}, ticks:{color:'#64748b',font:{size:9},maxTicksLimit:6} },
          y:{ grid:{color:'rgba(51,65,85,0.3)'}, ticks:{color:'#64748b',font:{size:10},callback:v=>'$'+v} }
        }
      }
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [data, stock.stock_id]);

  return (
    <div className="card p-4 h-full flex flex-col">
      <div className="flex items-center justify-between mb-3 pb-3 border-b border-slate-800">
        <h3 className="font-semibold text-sm text-white">
          <i className="fa-solid fa-chart-line text-cyan-400 mr-1.5"></i>Price Chart
        </h3>
        <span className="text-[10px] font-mono text-slate-500">AVG() OVER · LAG() OVER</span>
      </div>
      <div className="flex-1 min-h-[300px] relative"><canvas ref={ref}></canvas></div>
    </div>
  );
}

// ─── ORDER FORM ─────────────────────────────────────────────
function OrderForm({ stock, portfolio, onOrder }) {
  const [side, setSide] = useState('BUY');
  const [qty, setQty] = useState(5);
  const [orderType, setOrderType] = useState('MARKET');
  const [limitPrice, setLimit] = useState(stock.current_price);
  const [busy, setBusy] = useState(false);

  useEffect(() => { setLimit(stock.current_price); }, [stock.stock_id, stock.current_price]);

  const holding = portfolio.find(p => p.stock_id === stock.stock_id);
  const held = holding ? holding.shares_held : 0;
  const price = orderType === 'MARKET' ? stock.current_price : limitPrice;
  const total = qty * price;

  const submit = async (e) => {
    e.preventDefault();
    if (qty <= 0) return;
    setBusy(true);
    await onOrder({
      stock_id: stock.stock_id,
      order_type: side,
      price_type: orderType,
      price: orderType === 'LIMIT' ? limitPrice : 0,
      quantity: parseInt(qty),
    });
    setBusy(false);
  };

  return (
    <div className="card p-4 flex flex-col justify-between">
      <div>
        <div className="grid grid-cols-2 gap-1.5 mb-3 bg-slate-900 p-1 rounded-lg">
          <button onClick={() => setSide('BUY')}
            className={`py-2 rounded-md text-xs font-bold uppercase ${side === 'BUY' ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}>Buy</button>
          <button onClick={() => setSide('SELL')}
            className={`py-2 rounded-md text-xs font-bold uppercase ${side === 'SELL' ? 'bg-rose-600 text-white' : 'text-slate-500'}`}>Sell</button>
        </div>

        <div className="flex items-center justify-between mb-3">
          <span className="text-[10px] text-slate-500 uppercase font-semibold">Type</span>
          <div className="flex bg-slate-900 rounded-md p-0.5">
            {['MARKET','LIMIT'].map(t => (
              <button key={t} onClick={() => setOrderType(t)}
                className={`px-2.5 py-1 rounded text-[11px] font-mono font-bold ${orderType === t ? 'bg-cyan-600 text-white' : 'text-slate-500'}`}>{t}</button>
            ))}
          </div>
        </div>

        <form onSubmit={submit} className="space-y-3 text-xs font-mono">
          {orderType === 'LIMIT' && (
            <div>
              <label className="block text-[10px] text-slate-500 mb-1 font-sans uppercase">Limit Price ($)</label>
              <input type="number" step="0.01" value={limitPrice}
                onChange={e => setLimit(parseFloat(e.target.value) || 0)}
                className="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-white focus:outline-none focus:border-cyan-500" />
            </div>
          )}
          <div>
            <div className="flex justify-between mb-1">
              <label className="text-[10px] text-slate-500 font-sans uppercase">Shares</label>
              <span className="text-[10px] text-slate-500">
                {side === 'BUY' ? `Avail: ${stock.available_shares}` : `Held: ${held}`}
              </span>
            </div>
            <input type="number" min="1" value={qty}
              onChange={e => setQty(parseInt(e.target.value) || 0)}
              className="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-white focus:outline-none focus:border-cyan-500" />
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-md p-2.5 space-y-1 text-[11px]">
            <div className="flex justify-between text-slate-500"><span>Price</span><span className="text-slate-300">${fmt(price)}</span></div>
            <div className="flex justify-between text-slate-500"><span>Total</span><span className="text-cyan-300 font-bold">${fmt(total)}</span></div>
          </div>

          <button type="submit" disabled={busy || qty <= 0}
            className={`btn w-full py-2.5 text-xs font-bold uppercase text-white ${side === 'BUY' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-rose-600 hover:bg-rose-700'}`}>
            {busy ? 'Placing...' : `${side} ${stock.stock_id}`}
          </button>
        </form>
      </div>

      <p className="text-[10px] text-slate-500 mt-3 pt-2 border-t border-slate-800 font-mono">
        <i className="fa-solid fa-lock mr-1"></i>SELECT ... FOR UPDATE
      </p>
    </div>
  );
}

// ─── PORTFOLIO ──────────────────────────────────────────────
function Portfolio({ portfolio, cash, setSelId, setTab, orders = [], onCancel, onCashChange, toast }) {
  const [cashAmount, setCashAmount] = useState('');
  const [cashBusy, setCashBusy] = useState(false);

  const handleCash = async (action) => {
    const val = parseFloat(cashAmount);
    if (!val || val <= 0) {
      if (toast) toast('Invalid Amount', 'Please enter a positive dollar amount', 'ERROR');
      return;
    }
    setCashBusy(true);
    try {
      const res = await api('/me/cash', {
        method: 'POST',
        body: JSON.stringify({ action, amount: val })
      });
      if (onCashChange) onCashChange(res.cash_balance);
      if (toast) toast(action === 'DEPOSIT' ? 'Cash Deposited' : 'Cash Withdrawn', `${action === 'DEPOSIT' ? 'Added' : 'Withdrew'} $${val.toLocaleString()} successfully`, 'SUCCESS');
      setCashAmount('');
    } catch (e) {
      if (toast) toast('Transaction Failed', e.message, 'ERROR');
    } finally {
      setCashBusy(false);
    }
  };

  let tv = 0, tc = 0;
  portfolio.forEach(h => {
    tv += parseFloat(h.current_value || 0);
    tc += h.shares_held * parseFloat(h.avg_buy_price || 0);
  });
  const pnl = tv - tc;
  const nw = parseFloat(cash || 0) + tv;

  return (
    <div className="space-y-5">
      <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
        {[
          { l:'Net Worth',       v:nw,   c:'text-white' },
          { l:'Cash Balance',    v:cash, c:'text-emerald-400' },
          { l:'Portfolio Value', v:tv,   c:'text-cyan-300' },
          { l:'Unrealized P&L',  v:pnl,  c: pnl >= 0 ? 'text-emerald-400' : 'text-rose-400' }
        ].map((c, i) => (
          <div key={i} className="card p-5">
            <div className="text-[10px] text-slate-500 uppercase font-semibold mb-2">{c.l}</div>
            <div className={`text-2xl font-bold font-mono ${c.c}`}>
              {c.l === 'Unrealized P&L' && pnl >= 0 ? '+' : ''}${fmt(c.v)}
            </div>
          </div>
        ))}
      </div>

      {/* ── Cash Deposit & Withdrawal Panel ── */}
      <div className="card p-5 border border-slate-800 bg-[#0d131f]">
        <div className="flex flex-wrap items-center justify-between gap-4">
          <div>
            <h3 className="font-semibold text-white text-sm flex items-center gap-2">
              <i className="fa-solid fa-money-bill-transfer text-emerald-400"></i>
              Account Funds & Liquidity
            </h3>
            <p className="text-xs text-slate-400 mt-0.5">
              Current available cash: <span className="text-emerald-400 font-mono font-semibold">${fmt(cash)}</span>
            </p>
          </div>
          <div className="flex flex-wrap items-center gap-2">
            <div className="relative">
              <span className="absolute left-3 top-2.5 text-slate-500 text-xs">$</span>
              <input type="number" min="1" step="100" placeholder="Amount"
                value={cashAmount} onChange={e => setCashAmount(e.target.value)}
                disabled={cashBusy}
                className="w-36 pl-6 pr-3 py-2 bg-slate-900 border border-slate-700 rounded-md text-xs font-mono text-white focus:outline-none focus:border-cyan-500" />
            </div>
            <button onClick={() => handleCash('DEPOSIT')} disabled={cashBusy || !cashAmount}
              className="btn px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold flex items-center gap-1.5 disabled:opacity-50">
              <i className="fa-solid fa-plus"></i> Deposit
            </button>
            <button onClick={() => handleCash('WITHDRAW')} disabled={cashBusy || !cashAmount}
              className="btn px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold flex items-center gap-1.5 disabled:opacity-50">
              <i className="fa-solid fa-minus"></i> Withdraw
            </button>
            <div className="flex gap-1 ml-2">
              {[1000, 5000, 10000].map(quick => (
                <button key={quick} type="button" onClick={() => setCashAmount(quick.toString())}
                  className="px-2 py-1 bg-slate-800/80 hover:bg-slate-700 text-[11px] text-slate-300 rounded font-mono">
                  +${quick >= 1000 ? quick / 1000 + 'k' : quick}
                </button>
              ))}
            </div>
          </div>
        </div>
      </div>

      <div className="card p-5">
        <h3 className="font-semibold text-white mb-4">
          <i className="fa-solid fa-briefcase text-cyan-400 mr-1.5"></i>Holdings
        </h3>
        {portfolio.length === 0 ? (
          <div className="text-center py-10 text-slate-500 text-sm">
            <p>No settled positions yet.</p>
            {orders.length > 0 && (
              <p className="text-xs text-amber-400 mt-2">
                <i className="fa-solid fa-hourglass-half mr-1"></i>
                You have {orders.length} order(s) resting in the order book below waiting to be filled.
              </p>
            )}
          </div>
        ) : (
          <table className="w-full text-left font-mono text-xs">
            <thead>
              <tr className="border-b border-slate-800 text-slate-500 uppercase text-[10px]">
                <th className="py-3 px-3 font-sans">Asset</th>
                <th className="py-3 px-3 text-right font-sans">Shares</th>
                <th className="py-3 px-3 text-right font-sans">Avg Buy</th>
                <th className="py-3 px-3 text-right font-sans">Current</th>
                <th className="py-3 px-3 text-right font-sans">Value</th>
                <th className="py-3 px-3 text-right font-sans">P&L</th>
              </tr>
            </thead>
            <tbody>
              {portfolio.map(h => {
                const up = parseFloat(h.unrealized_pnl) >= 0;
                return (
                  <tr key={h.stock_id} className="border-b border-slate-800/50 hover:bg-slate-800/30">
                    <td className="py-3 px-3">
                      <button onClick={() => { setSelId(h.stock_id); setTab('terminal'); }} className="text-left">
                        <span className="font-bold text-cyan-400 text-sm">{h.stock_id}</span><br/>
                        <span className="text-[10px] text-slate-500 font-sans">{h.company_name}</span>
                      </button>
                    </td>
                    <td className="py-3 px-3 text-right text-white font-semibold">{h.shares_held}</td>
                    <td className="py-3 px-3 text-right text-slate-400">${fmt(h.avg_buy_price)}</td>
                    <td className="py-3 px-3 text-right text-white">${fmt(h.current_price)}</td>
                    <td className="py-3 px-3 text-right text-white font-semibold">${fmt(h.current_value)}</td>
                    <td className={`py-3 px-3 text-right font-semibold ${up ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {up ? '+' : ''}${fmt(h.unrealized_pnl)}
                      <br/><span className="text-[10px]">({up ? '+' : ''}{fmt(h.pnl_pct)}%)</span>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {orders && orders.length > 0 && (
        <div className="card p-5 border border-amber-900/40 bg-amber-950/10">
          <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
            <h3 className="font-semibold text-white text-sm">
              <i className="fa-solid fa-hourglass-half text-amber-400 mr-1.5"></i>
              Open Orders Pending Match ({orders.length})
            </h3>
            <span className="text-[11px] text-slate-400">
              Orders enter your portfolio automatically once a counterparty matches them
            </span>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-xs font-mono">
              <thead>
                <tr className="border-b border-slate-800 text-slate-500 uppercase text-[10px]">
                  <th className="text-left py-2 px-2">Order ID</th>
                  <th className="text-left py-2 px-2">Stock</th>
                  <th className="text-left py-2 px-2">Side</th>
                  <th className="text-left py-2 px-2">Type</th>
                  <th className="text-right py-2 px-2">Price</th>
                  <th className="text-right py-2 px-2">Fill Progress</th>
                  <th className="text-center py-2 px-2">Action</th>
                </tr>
              </thead>
              <tbody>
                {orders.map(o => (
                  <tr key={o.order_id} className="border-b border-slate-800/50">
                    <td className="py-2 px-2 text-slate-500">#{o.order_id}</td>
                    <td className="py-2 px-2 text-white font-semibold">{o.stock_id}</td>
                    <td className={`py-2 px-2 font-semibold ${o.order_type === 'BUY' ? 'text-emerald-400' : 'text-rose-400'}`}>{o.order_type}</td>
                    <td className="py-2 px-2 text-slate-400">{o.price_type}</td>
                    <td className="py-2 px-2 text-right text-slate-300">${fmt(o.price)}</td>
                    <td className="py-2 px-2 text-right text-amber-300 font-semibold">
                      {o.filled_qty}/{o.quantity} ({o.status})
                    </td>
                    <td className="py-2 px-2 text-center">
                      <button onClick={() => onCancel(o.order_id)} className="btn px-2 py-1 bg-rose-900/30 hover:bg-rose-900/50 text-rose-300 text-[11px]">
                        Cancel Order
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

                    <td className="py-2 px-2 text-right text-white">${fmt(g.current_price)}</td>
                    <td className={`py-2 px-2 text-right font-semibold ${g.pct_change >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {g.pct_change >= 0 ? '+' : ''}{fmt(g.pct_change)}%
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div className="card p-5">
            <div className="flex justify-between items-center mb-3">
              <h3 className="font-semibold text-white text-sm">
                <i className="fa-solid fa-wave-square text-cyan-400 mr-1.5"></i>Rolling Averages — {sel.stock_id}
              </h3>
              <span className="text-[10px] font-mono text-cyan-400">AVG() · LAG()</span>
            </div>
            <div className="max-h-[340px] overflow-y-auto">
              <table className="w-full text-xs font-mono">
                <thead className="sticky top-0 bg-[#111827] border-b border-slate-800">
                  <tr className="text-slate-500 uppercase text-[10px]">
                    <th className="text-left py-2 px-2">Time</th>
                    <th className="text-right py-2 px-2">Price</th>
                    <th className="text-right py-2 px-2">Δ</th>
                    <th className="text-right py-2 px-2">MA-5</th>
                  </tr>
                </thead>
                <tbody>
                  {rolling.slice().reverse().map((p, i) => (
                    <tr key={i} className="border-b border-slate-800/50">
                      <td className="py-1.5 px-2 text-slate-500">
                        {new Date(p.recorded_at).toLocaleTimeString('en-GB', { hour12:false })}
                      </td>
                      <td className="py-1.5 px-2 text-right text-white">${fmt(p.price)}</td>
                      <td className={`py-1.5 px-2 text-right ${p.lag_diff >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {p.lag_diff >= 0 ? '+' : ''}{fmt(p.lag_diff)}
                      </td>
                      <td className="py-1.5 px-2 text-right text-cyan-300">${fmt(p.ma_5)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      ) : (
        <div className="card p-5">
          <h3 className="font-semibold text-white text-sm mb-3">
            <i className="fa-solid fa-terminal text-emerald-400 mr-1.5"></i>Transaction Log
          </h3>
          <div className="bg-black border border-slate-800 rounded-md p-3 h-[460px] overflow-y-auto space-y-1 font-mono text-[11px]">
            {logs.map(log => {
              const c = { SQL:'text-cyan-300', TRIGGER:'text-purple-300', TRANSACTION:'text-emerald-300', SYSTEM:'text-amber-300' }[log.type] || 'text-slate-400';
              return (
                <div key={log.id} className="flex gap-2 py-0.5">
                  <span className="text-slate-600 w-16 flex-shrink-0">{log.timestamp}</span>
                  <span className={`w-20 flex-shrink-0 uppercase text-[9px] ${c}`}>{log.type}</span>
                  <span className="text-slate-300 break-all">{log.message}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── ADMIN ──────────────────────────────────────────────────
function Admin({ stocks, refresh, toast }) {
  const [ticker, setTicker] = useState('');
  const [name, setName]     = useState('');
  const [price, setPrice]   = useState(150);
  const [users, setUsers]   = useState([]);

  useEffect(() => {
    let cancel = false;
    api('/admin/users').then(u => { if (!cancel) setUsers(u); }).catch(() => {});
    return () => { cancel = true; };
  }, []);

  const addStock = async (e) => {
    e.preventDefault();
    try {
      await api('/stocks', { method:'POST', body:JSON.stringify({
        stock_id: ticker.toUpperCase(), company_name: name,
        sector:'Technology', current_price: parseFloat(price)
      })});
      toast('Listed', `${ticker.toUpperCase()} added`, 'SUCCESS');
      setTicker(''); setName(''); refresh();
    } catch (e) { toast('Failed', e.message, 'ERROR'); }
  };

  const delistStock = async (sid) => {
    if (!window.confirm(`Delist ${sid}? This cannot be undone.`)) return;
    try {
      await api('/stocks/' + sid, { method:'DELETE' });
      toast('Delisted', `${sid} removed from exchange`, 'SUCCESS');
      refresh();
    } catch (e) { toast('Failed', e.message, 'ERROR'); }
  };

  const shock = async (type) => {
    try {
      await api('/simulate/shock', { method:'POST', body:JSON.stringify({ shock_type: type }) });
      toast('Shock Applied', type, 'SUCCESS'); refresh();
    } catch (e) { toast('Failed', e.message, 'ERROR'); }
  };

  const verify = async () => {
    try {
      const rows = await api('/verify/consistency');
      const bad  = rows.filter(r => !r.consistent);
      if (bad.length === 0) toast('Consistency OK', 'All stocks: available + held = total_supply', 'SUCCESS');
      else toast('Mismatch', bad.map(b => b.stock_id).join(', '), 'ERROR');
    } catch (e) { toast('Failed', e.message, 'ERROR'); }
  };

  return (
    <div className="space-y-5">
      {/* ── Stats ── */}
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
        {[
          { l:'Listed Stocks',    v: stocks.length },
          { l:'Available Shares', v: stocks.reduce((s, x) => s + x.available_shares, 0).toLocaleString() },
          { l:'Exchange Volume',  v: stocks.reduce((s, x) => s + Number(x.volume || 0), 0).toLocaleString() },
        ].map((c, i) => (
          <div key={i} className="card p-5">
            <div className="text-[10px] text-slate-500 uppercase font-semibold mb-1">{c.l}</div>
            <div className="text-2xl font-bold font-mono text-cyan-300">{c.v}</div>
          </div>
        ))}
      </div>

      {/* ── Stocks table with delist ── */}
      <div className="card p-5">
        <h3 className="font-semibold text-white mb-4">
          <i className="fa-solid fa-list text-cyan-400 mr-1.5"></i>
          Listed Stocks
        </h3>
        <div className="overflow-x-auto">
          <table className="w-full text-xs font-mono">
            <thead>
              <tr className="border-b border-slate-800 text-slate-500 uppercase text-[10px]">
                <th className="text-left py-2 px-3">Ticker</th>
                <th className="text-left py-2 px-3">Company</th>
                <th className="text-right py-2 px-3">Price</th>
                <th className="text-right py-2 px-3">Avail</th>
                <th className="text-right py-2 px-3">Volume</th>
                <th className="text-center py-2 px-3">Action</th>
              </tr>
            </thead>
            <tbody>
              {stocks.map(s => (
                <tr key={s.stock_id} className="border-b border-slate-800/50 hover:bg-slate-800/20">
                  <td className="py-2 px-3 font-bold text-cyan-400">{s.stock_id}</td>
                  <td className="py-2 px-3 text-slate-300">{s.company_name}</td>
                  <td className="py-2 px-3 text-right text-white">${fmt(s.current_price)}</td>
                  <td className="py-2 px-3 text-right text-slate-400">{s.available_shares}</td>
                  <td className="py-2 px-3 text-right text-slate-400">{Number(s.volume||0).toLocaleString()}</td>
                  <td className="py-2 px-3 text-center">
                    <button onClick={() => delistStock(s.stock_id)}
                      className="text-rose-400 hover:text-rose-300 text-[11px] font-semibold">
                      Delist
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* ── Users table ── */}
      <div className="card p-5">
        <h3 className="font-semibold text-white mb-4">
          <i className="fa-solid fa-users text-purple-400 mr-1.5"></i>
          All Users
        </h3>
        {users.length === 0 ? (
          <p className="text-slate-500 text-xs text-center py-4">Loading...</p>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-xs font-mono">
              <thead>
                <tr className="border-b border-slate-800 text-slate-500 uppercase text-[10px]">
                  <th className="text-left py-2 px-3">User</th>
                  <th className="text-left py-2 px-3">Role</th>
                  <th className="text-right py-2 px-3">Cash</th>
                  <th className="text-right py-2 px-3">Portfolio</th>
                  <th className="text-right py-2 px-3">Orders</th>
                  <th className="text-right py-2 px-3">Trades</th>
                </tr>
              </thead>
              <tbody>
                {users.map(u => (
                  <tr key={u.user_id} className="border-b border-slate-800/50 hover:bg-slate-800/20">
                    <td className="py-2 px-3">
                      <span className="text-white font-semibold">{u.username}</span>
                      <br/><span className="text-slate-600 text-[10px]">{u.email}</span>
                    </td>
                    <td className="py-2 px-3">
                      <span className={u.role === 'admin' ? 'text-amber-400' : 'text-slate-400'}>
                        {u.role}
                      </span>
                    </td>
                    <td className="py-2 px-3 text-right text-emerald-400">${fmt(u.cash_balance)}</td>
                    <td className="py-2 px-3 text-right text-cyan-400">${fmt(u.portfolio_value)}</td>
                    <td className="py-2 px-3 text-right text-slate-300">{u.total_orders}</td>
                    <td className="py-2 px-3 text-right text-slate-300">{u.total_trades}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* ── Add Stock + Shock ── */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="card p-5">
          <h3 className="font-semibold text-white mb-4">
            <i className="fa-solid fa-plus-circle text-cyan-400 mr-1.5"></i>List New Stock
          </h3>
          <form onSubmit={addStock} className="space-y-3 text-xs font-mono">
            <input value={ticker} onChange={e => setTicker(e.target.value)} placeholder="Ticker (e.g. AMD)" required
              className="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-white uppercase focus:outline-none focus:border-cyan-500" />
            <input value={name} onChange={e => setName(e.target.value)} placeholder="Company Name" required
              className="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-white focus:outline-none focus:border-cyan-500" />
            <input type="number" value={price} onChange={e => setPrice(e.target.value)} placeholder="Price ($)" required
              className="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-white focus:outline-none focus:border-cyan-500" />
            <button type="submit"
              className="btn w-full py-2.5 bg-cyan-600 hover:bg-cyan-700 text-white font-bold uppercase">List</button>
          </form>
        </div>

        <div className="card p-5">
          <h3 className="font-semibold text-white mb-4">
            <i className="fa-solid fa-explosion text-amber-400 mr-1.5"></i>Market Shock
          </h3>
          <div className="grid grid-cols-3 gap-3 mb-4">
            {[
              { t:'BULL',  l:'Bull +8%',   c:'bg-emerald-600/20 hover:bg-emerald-600/40 border-emerald-700 text-emerald-300' },
              { t:'CRASH', l:'Crash -10%', c:'bg-rose-600/20 hover:bg-rose-600/40 border-rose-700 text-rose-300' },
              { t:'SPIKE', l:'Spike',      c:'bg-amber-600/20 hover:bg-amber-600/40 border-amber-700 text-amber-300' },
            ].map(s => (
              <button key={s.t} onClick={() => shock(s.t)}
                className={`btn p-4 border text-xs font-bold ${s.c}`}>{s.l}</button>
            ))}
          </div>
          <div className="border-t border-slate-800 pt-4">
            <button onClick={verify}
              className="btn w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs">
              <i className="fa-solid fa-check-circle mr-1.5"></i>Run Consistency Check
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── TOAST ──────────────────────────────────────────────────
function Toast({ data, close }) {
  const bc = { SUCCESS:'border-l-emerald-500', ERROR:'border-l-rose-500', INFO:'border-l-cyan-500' }[data.type] || 'border-l-slate-500';
  return (
    <div className={`fixed bottom-5 right-5 z-50 max-w-sm w-full card p-4 border-l-4 ${bc}`}>
      <div className="flex items-start justify-between gap-3">
        <div>
          <h4 className="font-semibold text-sm text-white">{data.title}</h4>
          <p className="text-xs text-slate-400 mt-0.5">{data.msg}</p>
        </div>
        <button onClick={close} className="text-slate-500 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.error('ErrorBoundary caught:', error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="min-h-screen flex items-center justify-center p-6 text-center">
          <div className="card p-8 max-w-lg">
            <i className="fa-solid fa-triangle-exclamation text-rose-400 text-3xl mb-3"></i>
            <h2 className="text-xl font-bold text-white mb-2">Interface Error</h2>
            <p className="text-xs text-rose-300 font-mono mb-4">{this.state.error?.message || 'An unexpected rendering error occurred'}</p>
            <button onClick={() => { localStorage.clear(); window.location.reload(); }}
              className="btn px-4 py-2 bg-cyan-600 text-white text-xs">Reset Cache & Reload</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>
